<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cambiar contraseña | NovaSalud</title>
        <link rel="icon" type="image/svg+xml" href="../assets/hospital-regular-full.svg">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="../css/panel.css" />
    </head>
    <body>

        <div class="pagina-clave">
            <div class="tarjeta-clave">
                <h1 class="titulo-clave display-6">NOVASALUD</h1>
                <p class="subtitulo-clave">Cambio de contraseña obligatorio</p>

                <div id="avisoUsuario" class="alert alert-info py-2 d-none" role="status"></div>

                <form id="formCambiarClave" novalidate>
                    <div class="mb-3">
                        <label for="nuevaClave" class="form-label fw-semibold">Nueva contraseña</label>
                        <input id="nuevaClave" class="form-control" type="password"
                            minlength="6" required autocomplete="new-password" />
                    </div>

                    <div class="mb-3">
                        <label for="confirmarClave" class="form-label fw-semibold">Confirmar contraseña</label>
                        <input id="confirmarClave" class="form-control" type="password"
                            minlength="6" required autocomplete="new-password" />
                    </div>

                    <div id="mensajeClave" class="small text-danger mb-2" role="alert"></div>

                    <button type="submit" class="btn-clave" id="btnCambiar">Cambiar contraseña</button>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/cambiar-contrasena.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVASALUD - Iniciar Sesión</title>
    <link rel="icon" type="image/svg+xml" href="assets/hospital-regular-full.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/login.css" />
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="contenedor-principal">
        <h1 class="text-center display-6 fw-bold" style="color:#00478d;">NOVASALUD</h1>
        <p class="text-center text-secondary">Plataforma Clínica Integral</p>

        <form id="formLogin">
            <div class="mb-3">
                <label for="correo" class="form-label text-uppercase fw-bold small mb-1 text-dark">Correo electrónico</label>
                <input id="correo" class="form-control input-custom" type="email" autocomplete="username" required />
            </div>

            <div class="mb-3">
                <label for="clave" class="form-label text-uppercase fw-bold small mb-1 text-dark">Contraseña</label>
                <input id="clave" class="form-control input-custom" type="password" autocomplete="current-password" required />
            </div>

            <div id="mensajeLogin" class="small text-danger mb-2" role="alert"></div>

            <button type="submit" class="btn-login w-100 py-2" id="btnIngresar">Iniciar Sesión</button>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>

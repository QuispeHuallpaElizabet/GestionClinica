<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVASALUD-Iniciar Sesión</title>
    <link rel="icon" type="image/svg+xml" href="assets/hospital-regular-full.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles_login.css" />
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3" style="background:#f0f3ff;">

    <div class="contenedor-principal">
        <h1 class="text-center display-6 fw-bold" style="color:#00478d;">NOVASALUD</h1>
        <p class="text-center text-secondary">Plataforma Clínica Integral</p>

        <form>
            <!-- Correo -->
            <div class="mb-3">
                <label for="email" class="form-label text-uppercase fw-bold small mb-1 text-dark">correo electrónico</label>
                <input type="email" class="form-control input-custom" id="email"/>
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
                <label for="password" class="form-label text-uppercase fw-bold small mb-1 text-dark">contraseña</label>
                <input type="password" class="form-control input-custom" id="password"/>
            </div>

            <!-- Botón -->
            <button type="button" class="btn-login w-100 py-2" onclick="loguear()">Iniciar Sesión</button>
        </form>
    </div>

    <script src="js/autenticacion.js"></script>
</body>
</html>
